services:
  db:
    image: mariadb:11.4
    restart: "no"
    environment:
      MARIADB_DATABASE: ${DB_NAME:?Set DB_NAME in .env}
      MARIADB_USER: ${DB_USER:?Set DB_USER in .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
  wordpress:
    image: wordpress:php8.3-apache
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WP_PORT:-8080}:80"
    environment: &wp_environment
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      OLDBEAR_SMTP_HOST: mailpit
    volumes: &wp_volumes
      - ./data/wordpress:/var/www/html
      - ./wp-content/themes/oldbearstudios:/var/www/html/wp-content/themes/oldbearstudios:ro
      - ./wp-content/plugins/oldbear-studio:/var/www/html/wp-content/plugins/oldbear-studio:ro
      - ./tests:/opt/oldbear-tests:ro
  cli:
    image: wordpress:cli-php8.3
    user: "33:33"
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *wp_environment
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_URL: ${WP_URL:-http://localhost:8080}
    volumes: *wp_volumes
  mailpit:
    image: axllent/mailpit:v1.27.0
    restart: "no"
    ports:
      - "127.0.0.1:${MAIL_PORT:-8025}:8025"

