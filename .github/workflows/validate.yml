name: Validate WordPress
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wordpress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check JS, JSON, SVG and Linux shell
        run: |
          node --check wp-content/themes/oldbearstudios/assets/site.js
          find . -name '*.sh' -not -path './.git/*' -exec bash -n {} +
          python3 - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET
          theme = pathlib.Path('wp-content/themes/oldbearstudios')
          json.loads((theme / 'theme.json').read_text())
          for asset in theme.glob('assets/*.svg'):
              ET.parse(asset)
          PY
      - name: Test Linux installer and uninstaller safeguards
        run: python3 -m unittest discover -s tests -p test_linux.py -v
      - name: Install full Linux package
        run: OLDBEAR_NO_OPEN=1 bash Instalar.sh
      - name: Validate PHP and WordPress behavior
        run: bash scripts/check.sh
      - name: Check HTTP pages
        run: |
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:8080/ > /tmp/oldbear-home.html
          python3 - <<'PY'
          from pathlib import Path
          html = Path('/tmp/oldbear-home.html').read_text()
          assert 'Pequeño estudio. Grandes aventuras.' in html
          assert 'CONCEPTO VISUAL' in html
          assert 'Fatal error' not in html
          assert 'name="contact_email"' not in html, 'Form must be disabled before setup'
          PY
          curl --fail http://localhost:8080/diario/ > /dev/null
      - name: Package Linux folder and offline preview
        run: python3 scripts/package.py --snapshot /tmp/oldbear-home.html
      - name: Test real stop, restart, reinstall and uninstall
        run: bash tests/lifecycle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: oldbearstudios-wordpress
          path: dist/*.zip
      - name: Diagnostic logs
        if: failure()
        run: |
          if test -f .env; then bash Diagnostico.sh; fi
      - name: Stop local services
        if: always()
        run: |
          if test -f .env; then bash Detener.sh; fi

